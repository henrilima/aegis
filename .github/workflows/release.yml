name: Release
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libwebkit2gtk-4.0-dev build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Sync node version and setup cache
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Check Secrets (Debug)
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then echo "ERRO: TAURI_SIGNING_PRIVATE_KEY está vazia!"; else echo "OK: Chave encontrada."; fi
        shell: bash

      - name: Build Tauri App
        run: npx tauri build --verbose
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate latest.json
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $tag = "${{ github.ref_name }}"
          # Busca recursiva para garantir que encontre o .sig no Tauri v2
          $sigFile = Get-ChildItem -Path "src-tauri/target/release/bundle" -Recurse -Filter "*.exe.sig" | Select-Object -First 1
          
          if (-not $sigFile) { 
            Write-Host "AVISO: Assinatura automática falhou. Tentando assinatura manual..."
            $exeFile = Get-ChildItem -Path "src-tauri/target/release/bundle" -Recurse -Filter "*.exe" | Select-Object -First 1
            if (-not $exeFile) { throw "Executável .exe não encontrado para assinatura!" }
            
            # Comando de assinatura manual do Tauri v2 (ele cria o arquivo .sig automaticamente)
            npx tauri signer sign -k "$env:TAURI_SIGNING_PRIVATE_KEY" -p "$env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD" $exeFile.FullName
            $sigFile = Get-Item -Path "$($exeFile.FullName).sig"
            Write-Host "Sucesso: Assinatura manual gerada em $($sigFile.FullName)"
          }
          
          $signature = Get-Content -Path $sigFile.FullName
          
          $json = @{
            version = $tag
            notes = "Atualização automática do Sistema Aegis."
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              "windows-x86_64" = @{
                signature = $signature
                url = "https://github.com/henrilima/aegis/releases/download/$tag/Aegis_${version}_x64-setup.exe"
              }
            }
          }
          $json | ConvertTo-Json -Depth 10 | Set-Content -Path "latest.json"

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/dmg/*.dmg
            latest.json
          fail_on_unmatched_files: false
          tag_name: ${{ github.ref_name }}
          name: "Aegis ${{ github.ref_name }}"
          body: "Atualização automática do Sistema Aegis."
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
