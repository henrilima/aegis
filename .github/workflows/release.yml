name: Release
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Sync node version and setup cache
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Aegis ${{ github.ref_name }}'
          releaseBody: 'Atualização automática do Sistema Aegis.'
          releaseDraft: true
          prerelease: false
          args: --verbose

      - name: Generate latest.json
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $tag = "${{ github.ref_name }}"
          $sigFile = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*.sig" | Select-Object -First 1
          if (-not $sigFile) { throw "Arquivo de assinatura .sig não encontrado!" }
          $signature = Get-Content -Path $sigFile.FullName
          
          $json = @{
            version = $tag
            notes = "Atualização automática do Sistema Aegis."
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              "windows-x86_64" = @{
                signature = $signature
                url = "https://github.com/henrilima/aegis/releases/download/$tag/Aegis_${version}_x64-setup.exe"
              }
            }
          }
          $json | ConvertTo-Json -Depth 10 | Set-Content -Path "latest.json"
          
      - name: Upload latest.json to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: latest.json
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
