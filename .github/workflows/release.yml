name: Release
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Sync node version and setup cache
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Check Secrets (Debug)
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then echo "ERRO: TAURI_SIGNING_PRIVATE_KEY está vazia!"; else echo "OK: Chave encontrada."; fi
        shell: bash

      - name: Build Tauri App
        run: npx tauri build --verbose
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate latest.json
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $tag = "${{ github.ref_name }}"
          $sigFile = Get-ChildItem -Path "src-tauri/target/release/bundle" -Recurse -Filter "*.exe.sig" | Select-Object -First 1
          
          if (-not $sigFile) { 
            Write-Host "ERRO: Arquivo .sig não encontrado. Listando arquivos para debug:"
            Get-ChildItem -Path "src-tauri/target/release/bundle" -Recurse
            throw "Arquivo de assinatura .sig não encontrado!" 
          }
          
          $signature = Get-Content -Path $sigFile.FullName
          
          $json = @{
            version = $tag
            notes = "Atualização automática do Sistema Aegis."
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              "windows-x86_64" = @{
                signature = $signature
                url = "https://github.com/henrilima/aegis/releases/download/$tag/Aegis_${version}_x64-setup.exe"
              }
            }
          }
          $json | ConvertTo-Json -Depth 10 | Set-Content -Path "latest.json"

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi.sig
            latest.json
          tag_name: ${{ github.ref_name }}
          name: "Aegis ${{ github.ref_name }}"
          body: "Atualização automática do Sistema Aegis."
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
