[package]
name = "Aegis"
version = "4.0.0"
description = "Aegis is a productivity-focused desktop application designed to help users manage their daily tasks, notes, and goals with a modern, intuitive interface."
authors = ["José Henrique da Silva Lima"]
license = "MIT"
repository = "https://github.com/henrilima/aegis"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.0", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2.0.0"
uuid = { version = "1.8", features = ["v4", "serde"] }
rusqlite = { version = "0.38.0", features = ["bundled"] }
argon2 = "0.5.3"
aes-gcm = "0.10.3"
rand = "0.8.5"
csv = "1.3.0"
base64 = "0.22.1"
chrono = { version = "0.4.39", features = ["serde"] }
tauri-plugin-shell = "2.3.5"
tauri-plugin-dialog = "2.6.0"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-autostart = "2"
tauri-plugin-store = "2"
tauri-plugin-fs = "2.2.0"
tauri-plugin-http = "2"
yaml-front-matter = "0.1.0"
serde_yaml = "0.9.34"
reqwest = { version = "0.12", features = ["json", "native-tls"], default-features = false }
urlencoding = "2.1"
regex = "1.10"
screenshots = "0.8.10"
image = { version = "0.25", features = ["png", "ico", "jpeg"] }
ico = "0.3"
